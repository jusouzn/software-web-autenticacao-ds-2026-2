# Ambiente completo (RNF08): docker compose up -d
# As senhas abaixo são só para rodar localmente. Para trocar, crie um arquivo .env (ver .env.exemplo).

services:
  web:
    build: ./web
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: ./app
    environment:
      BANCO_URL: postgresql://app_autenticacao:${APP_DB_SENHA:-senha-local-app}@db:5432/autenticacao
      AMBIENTE: ${AMBIENTE:-producao}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autenticacao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:-senha-local-admin}
      APP_DB_SENHA: ${APP_DB_SENHA:-senha-local-app}
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autenticacao"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  dados:
