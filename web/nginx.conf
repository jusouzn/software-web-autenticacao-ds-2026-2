# RNF03: 5 tentativas por minuto por IP, com rajada de 5
limit_req_zone $binary_remote_addr zone=autenticacao:10m rate=5r/m;
limit_req_status 429;

server_tokens off;

# RNF01: tudo que chega por HTTP é redirecionado para HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certificados/servidor.crt;
    ssl_certificate_key /etc/nginx/certificados/servidor.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/seguranca.conf;

    root  /usr/share/nginx/html;
    index login.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        limit_req zone=autenticacao burst=5 nodelay;
        error_page 429 = @muitas_tentativas;

        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # resposta do limite de taxa no mesmo formato de erro da API (Seção 2.5)
    location @muitas_tentativas {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
        default_type application/problem+json;
        return 429 '{"type":"about:blank","title":"Muitas tentativas","status":429,"detail":"Muitas tentativas. Tente novamente mais tarde."}';
    }

    # o Swagger do FastAPI usa script inline e arquivos de CDN, então precisa de uma CSP mais aberta.
    # Fora do ambiente de desenvolvimento a aplicação responde 404 aqui.
    location = /api/docs {
        proxy_pass http://app:8000;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com" always;
    }
}
