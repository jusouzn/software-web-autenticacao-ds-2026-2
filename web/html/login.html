<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Entrar · Autenticação</title>
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/estilos.css">
  <script src="/autenticacao.js" defer></script>
</head>
<body>
  <main class="pagina">
    <section class="cartao" aria-labelledby="titulo">

      <div id="tela-login">
        <header class="cabecalho">
          <img class="marca" src="/icone.svg" alt="" width="40" height="40">
          <h1 id="titulo">Entrar</h1>
          <p class="subtitulo">Use seu login ou e-mail cadastrado.</p>
        </header>

        <div id="alerta" class="alerta" role="alert" hidden>
          <svg class="alerta-icone" viewBox="0 0 20 20" aria-hidden="true">
            <path fill="currentColor" d="M10 1.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17Zm0 4a.9.9 0 0 1 .9.9v4.2a.9.9 0 1 1-1.8 0V6.4a.9.9 0 0 1 .9-.9Zm0 9.2a1.1 1.1 0 1 1 0-2.2 1.1 1.1 0 0 1 0 2.2Z"/>
          </svg>
          <p id="alerta-texto"></p>
        </div>

        <form id="form-login" novalidate>
          <div class="campo">
            <label for="identificador">Login ou e-mail</label>
            <input id="identificador" name="identificador" type="text"
                   autocomplete="username" autocapitalize="none" spellcheck="false"
                   maxlength="254" required aria-describedby="identificador-erro">
            <p class="campo-erro" id="identificador-erro"></p>
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <div class="campo-senha">
              <input id="senha" name="senha" type="password"
                     autocomplete="current-password" maxlength="128" required
                     aria-describedby="senha-erro senha-caps">
              <button type="button" id="mostrar-senha" class="botao-mostrar"
                      aria-controls="senha" aria-pressed="false">Mostrar</button>
            </div>
            <p class="campo-aviso" id="senha-caps" hidden>Caps Lock está ativado.</p>
            <p class="campo-erro" id="senha-erro"></p>
          </div>

          <button type="submit" id="botao-entrar" class="botao botao-primario">
            <span class="spinner" aria-hidden="true"></span>
            <span class="botao-rotulo">Entrar</span>
          </button>
        </form>
      </div>

      <div id="tela-sucesso" class="sucesso" hidden>
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <h2 id="sucesso-titulo" tabindex="-1">Olá, <span id="usuario-nome"></span></h2>
        <p class="subtitulo">Suas credenciais foram verificadas.</p>

        <dl class="identidade">
          <div>
            <dt>Login</dt>
            <dd id="usuario-login"></dd>
          </div>
          <div>
            <dt>E-mail</dt>
            <dd id="usuario-email"></dd>
          </div>
          <div>
            <dt>ID</dt>
            <dd id="usuario-id" class="mono"></dd>
          </div>
        </dl>

        <button type="button" id="voltar" class="botao botao-secundario">Entrar com outra conta</button>
      </div>

    </section>

    <p class="rodape">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path fill="currentColor" d="M8 1a3.5 3.5 0 0 0-3.5 3.5V6H4a1.5 1.5 0 0 0-1.5 1.5v6A1.5 1.5 0 0 0 4 15h8a1.5 1.5 0 0 0 1.5-1.5v-6A1.5 1.5 0 0 0 12 6h-.5V4.5A3.5 3.5 0 0 0 8 1Zm2 5H6V4.5a2 2 0 1 1 4 0V6Z"/>
      </svg>
      Conexão protegida por HTTPS
    </p>
  </main>
</body>
</html>
