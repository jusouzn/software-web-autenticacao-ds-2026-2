# Cabeçalhos de segurança. Ficam num arquivo separado porque o Nginx não herda
# add_header para dentro de um location que declara os seus próprios.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
